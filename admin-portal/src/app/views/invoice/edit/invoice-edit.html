<section class="invoice-edit-page">
  <header class="d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <span class="material-symbols-outlined">edit_document</span>
      <h1 class="mb-0">Edit Invoice</h1>
    </div>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-secondary">Discard</button>
      <button type="button" class="btn btn-primary">Save Changes</button>
    </div>
  </header>

  <section class="panel">
    <h2>Invoice Identity</h2>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Invoice Reference</label>
        <input class="form-control" type="text" value="INV-2023-0892-VP" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Organisation</label>
        <select class="form-select">
          <option>Veritas Compliance Partners</option>
          <option>Aetheria Global Systems</option>
        </select>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Subscription Context</h2>
    <div class="btn-group mb-3" role="group" aria-label="Subscription period">
      <button type="button" class="btn btn-outline-secondary">Week</button>
      <button type="button" class="btn btn-outline-secondary active">Month</button>
      <button type="button" class="btn btn-outline-secondary">Year</button>
    </div>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Start Date</label>
        <input class="form-control" type="date" value="2023-10-01" />
      </div>
      <div class="col-md-6">
        <label class="form-label">End Date</label>
        <input class="form-control" type="date" value="2023-10-31" />
      </div>
    </div>
  </section>

  <div class="row g-3">
    <div class="col-md-6">
      <article class="panel">
      <h2>Financials</h2>
      <div>
        <label class="form-label">Invoice Amount</label>
        <input class="form-control" type="text" value="USD 12450.00" />
      </div>
      <small>Net amount excluding applicable regional taxes.</small>
      </article>
    </div>

    <div class="col-md-6">
      <article class="panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="mb-0">Payment Status</h2>
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="isPaid" checked />
            <label class="form-check-label fw-semibold" for="isPaid">Is Paid</label>
          </div>
        </div>

      <div>
        <label class="form-label">Payment Date</label>
        <input class="form-control" type="date" value="2023-11-05" />
      </div>

      <div>
        <label class="form-label">Payment Reference</label>
        <input class="form-control" type="text" value="TXN-48910029X" />
      </div>
      </article>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-6 col-md-3">
      <div class="panel text-center py-3">
        <span class="d-block text-uppercase fw-semibold small text-muted">Created At</span>
        <p class="mb-0">Oct 12, 2023 • 09:41</p>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="panel text-center py-3">
        <span class="d-block text-uppercase fw-semibold small text-muted">Created By</span>
        <p class="mb-0">A. Sterling</p>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="panel text-center py-3">
        <span class="d-block text-uppercase fw-semibold small text-muted">Modified At</span>
        <p class="mb-0">Nov 06, 2023 • 14:20</p>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="panel text-center py-3">
        <span class="d-block text-uppercase fw-semibold small text-muted">Modified By</span>
        <p class="mb-0">S. Chen</p>
      </div>
    </div>
  </div>
</section>
