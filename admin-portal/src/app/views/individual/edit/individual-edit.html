<section class="ind-edit-page" aria-label="Edit individual">
  <header class="edit-head">
    <div>
      <h1>Edit Individual</h1>
      <p>Modify compliance records for ID-VARS-99283</p>
    </div>
    <div class="head-actions">
      <button type="button" class="btn-secondary">Cancel</button>
      <button type="button" class="btn-primary">
        <span class="material-symbols-outlined" aria-hidden="true">save</span>
        Save Changes
      </button>
    </div>
  </header>

  <form class="edit-form">
    <section class="panel">
      <div class="section-head">
        <span class="material-symbols-outlined">person</span>
        <h2>Core Identity</h2>
      </div>

      <div class="field-grid field-grid-3">
        <label class="field-block"><span>First Name</span><input type="text" value="Alexander" /></label>
        <label class="field-block"><span>Middle Name</span><input type="text" value="James" /></label>
        <label class="field-block"><span>Surname</span><input type="text" value="Vaughan" /></label>
        <label class="field-block"><span>Sex</span><select><option>Male</option><option>Female</option></select></label>
        <label class="field-block"><span>Nationality</span><select><option>United Kingdom</option><option>United States</option></select></label>
        <label class="field-block"><span>Marital Status</span><select><option>Married</option><option>Single</option></select></label>
      </div>
    </section>

    <div class="two-col-grid">
      <section class="panel">
        <div class="section-head">
          <span class="material-symbols-outlined">badge</span>
          <h2>Identification</h2>
        </div>
        <div class="stack">
          <label class="field-block"><span>Identity Type</span><select><option>Biometric Passport</option></select></label>
          <label class="field-block"><span>Identity Number</span><input type="text" value="GBR-9988221-X" /></label>
        </div>
      </section>

      <section class="panel">
        <div class="section-head">
          <span class="material-symbols-outlined">verified_user</span>
          <h2>Compliance &amp; Employment</h2>
        </div>
        <div class="stack">
          <label class="field-block"><span>KYC Status</span><select><option>VERIFIED</option><option>PENDING</option><option>FLAGGED</option></select></label>
          <label class="field-block"><span>Employment Status</span><select><option>Full-Time Employed</option><option>Self-Employed</option></select></label>
        </div>
      </section>
    </div>

    <section class="panel">
      <div class="section-head">
        <span class="material-symbols-outlined">contact_mail</span>
        <h2>Contact Information</h2>
      </div>

      <div class="field-grid field-grid-2">
        <label class="field-block"><span>Email Address</span><input type="email" value="alex.vaughan@veritas.protocol" /></label>
        <label class="field-block"><span>Physical Address</span><textarea rows="2">12 High Street, Kensington, London, W8 4HX</textarea></label>
      </div>

      <div class="phone-section">
        <div class="phone-title">
          <span>Phone Numbers</span>
          <button type="button">+ Add Number</button>
        </div>
        <div class="phone-row">
          <label class="field-block"><span>Type</span><select><option>Mobile</option><option>Work</option></select></label>
          <label class="field-block"><span>Number</span><input type="text" value="+44 7700 900123" /></label>
          <button type="button" class="remove-btn">×</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <span class="material-symbols-outlined">account_tree</span>
        <h2>Organizational Context</h2>
      </div>

      <div class="field-grid field-grid-3 align-end-grid">
        <label class="field-block"><span>Organisation</span><input type="text" value="Global Wealth Partners" /></label>
        <label class="field-block"><span>Branch</span><select><option>London City - HQ</option></select></label>
        <div class="toggle-card">
          <span>Has System User</span>
          <label class="toggle-switch"><input type="checkbox" checked /><span></span></label>
        </div>
      </div>
    </section>
  </form>

  <footer class="stamp">
    <span></span>
    <p>Veritas Protocol Security Standard v4.2</p>
    <span></span>
  </footer>
</section>
