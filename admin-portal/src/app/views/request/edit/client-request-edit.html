<section class="req-edit-page" aria-label="Edit client request">
  <header class="edit-head">
    <div>
      <h1>Edit Client Request</h1>
      <p>Modify compliance records for client request processing</p>
    </div>
    <div class="head-actions">
      <button type="button" class="btn btn-secondary">Cancel</button>
      <button type="button" class="btn btn-primary">
        <span class="material-symbols-outlined" aria-hidden="true">save</span>
        Save Changes
      </button>
    </div>
  </header>

  <form class="edit-form">
    <section class="panel">
      <div class="d-flex align-items-center gap-2 mb-3">
        <span class="material-symbols-outlined">person</span>
        <h2 class="mb-0">Client Information</h2>
      </div>

      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Full Name</label><input class="form-control" type="text" value="Alexander Vance Sterling" /></div>
        <div class="col-md-4"><label class="form-label">Email Address</label><input class="form-control" type="email" value="a.sterling@nexfix.io" /></div>
        <div class="col-md-4"><label class="form-label">Phone Number</label><input class="form-control" type="tel" value="+44 7700 900123" /></div>
      </div>
    </section>

    <div class="row g-3">
      <div class="col-md-6">
        <section class="panel h-100">
          <div class="d-flex align-items-center gap-2 mb-3">
            <span class="material-symbols-outlined">badge</span>
            <h2 class="mb-0">Request Details</h2>
          </div>
        <div class="row g-3">
          <div class="col-12"><label class="form-label">Request ID</label><input class="form-control" type="text" value="CR-001" readonly /></div>
          <div class="col-md-6"><label class="form-label">Request Type</label><select class="form-select"><option>KYC Verification</option><option>Document Update</option></select></div>
          <div class="col-md-6"><label class="form-label">Priority</label><select class="form-select"><option>Normal</option><option>High</option><option>Urgent</option></select></div>
        </div>
        </section>
      </div>

      <div class="col-md-6">
        <section class="panel h-100">
          <div class="d-flex align-items-center gap-2 mb-3">
            <span class="material-symbols-outlined">verified_user</span>
            <h2 class="mb-0">Request Status</h2>
          </div>
        <div class="row g-3">
          <div class="col-12"><label class="form-label">Current Status</label><select class="form-select"><option>IN_REVIEW</option><option>APPROVED</option><option>REJECTED</option></select></div>
          <div class="col-12"><label class="form-label">Assigned To</label><select class="form-select"><option>System Administrator</option><option>Compliance Officer</option></select></div>
        </div>
        </section>
      </div>
    </div>

    <section class="panel">
      <div class="d-flex align-items-center gap-2 mb-3">
        <span class="material-symbols-outlined">contact_mail</span>
        <h2 class="mb-0">Organisation Information</h2>
      </div>

      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Organisation Name</label><input class="form-control" type="text" value="Global Tech Holdings LLC" /></div>
        <div class="col-md-6"><label class="form-label">Organisation Registration No.</label><input class="form-control" type="text" value="US-DE-99201" /></div>
      </div>
    </section>

    <section class="panel">
      <div class="d-flex align-items-center gap-2 mb-3">
        <span class="material-symbols-outlined">description</span>
        <h2 class="mb-0">Request Notes</h2>
      </div>

      <div class="col-12">
        <label class="form-label">Internal Comments</label>
        <textarea rows="4" class="form-control">Record notes and compliance comments here...</textarea>
      </div>
    </section>
  </form>
</section>
