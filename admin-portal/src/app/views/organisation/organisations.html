<section class="org-page" aria-label="Search organisations">
  <header class="org-header">
    <div>
      <h1>Search Organisations</h1>
      <p>
        Access the central registry to manage institutional compliance profiles and
        KYC documentation within the Veritas Protocol.
      </p>
    </div>
    <button type="button" [routerLink]="['/organisation', 'edit']">New Organisation</button>
  </header>

  <section class="org-search-card" aria-label="Search criteria">
    <form class="org-search-row" (submit)="doSearch()">
      <label class="sr-only" for="criteria">Search Criteria</label>
      <input id="criteria" type="text" [formField]="searchOrganisationsSignalForm.criteria" placeholder="Enter name, registration number or entity code..." />
      <button type="button" (click)="doSearch()">Search</button>
    </form>
  </section>

  <section class="org-table-card" aria-label="Organisation results">
    <div class="org-table-head" role="row">
      <p>Name</p>
      <p>Registration No.</p>
      <p>Code</p>
      <p>KYC Status</p>
      <p>Client Status</p>
      <p>Actions</p>
    </div>

    <mat-card class="form-section modern-card">
        <mat-card-header>
          <mat-card-title>
            <mat-icon>assignment</mat-icon>
            {{ 'search.results' | translate }}
          </mat-card-title>
        </mat-card-header>
        <mat-card-content class="modern-content results-content">
          <div class="table-container">
            <app-table #organisationsTable [dataColumns]="organisationsTableColumns" [showActions]="true" [paged]="true" [actions]="organisationsTableColumnsActions" (actionClicked)="organisationsTableActionClicked($event)" [dataSignal]="organisationsTableSignal">
            </app-table>
          </div>
        </mat-card-content>
      </mat-card>
  </section>
