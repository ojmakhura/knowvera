<!-- platform-identity.html -->
<section class="settings-page">
  <header class="settings-page__header">
    <div>
      <h2 class="settings-page__title">Platform Identity</h2>
      <p class="settings-page__subtitle">Branding, URLs, and support contact for this instance.</p>
    </div>
  </header>

  <form class="settings-card">
    <div class="settings-card__header">
      <mat-icon>branding_watermark</mat-icon>
      <h3 class="settings-card__title">Platform Identity</h3>
    </div>

    <div class="settings-card__grid">
      <label class="field">
        <span class="field__label">Platform Name</span>
        <input class="field__input" type="text" [formField]="platformIdentityForm.platformName" />
      </label>

      <label class="field">
        <span class="field__label">Platform URL</span>
        <input class="field__input" type="url" [formField]="platformIdentityForm.platformUrl" />
      </label>

      <label class="field">
        <span class="field__label">KYC Portal Link</span>
        <input class="field__input" type="url" [formField]="platformIdentityForm.kycPortalLink" />
      </label>

      <label class="field">
        <span class="field__label">Support Contact Email</span>
        <input class="field__input" type="email" [formField]="platformIdentityForm.supportContact" />
        <!-- @if (form.controls.supportEmail.invalid && form.controls.supportEmail.touched) {
          <span class="field__error">Enter a valid email address</span>
        } -->
      </label>
    </div>

    <div class="settings-card__actions">
      <button type="button" class="btn btn-action-primary" (click)="save()">
        <mat-icon class="me-1">save</mat-icon>
        Save Configuration
      </button>
    </div>
  </form>
</section>
