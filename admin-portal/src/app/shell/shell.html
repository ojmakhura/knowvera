<mat-sidenav-container class="shell-layout">
  <mat-sidenav #sidenav class="shell-sidebar" mode="side" opened aria-label="Primary navigation">
    <div class="brand">
      <div class="brand-mark">◍</div>
      <div>
        <p class="brand-title">Central KYC</p>
      </div>
    </div>

    <button mat-flat-button color="primary" class="new-btn" type="button">
      <mat-icon>add</mat-icon> New Verification
    </button>

    <mat-nav-list class="sidebar-nav">
      @for (item of menus; track item.titleKey) {
        <a
          mat-list-item
          class="nav-item"
          [routerLink]="item.routerLink"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle translate>{{ item.titleKey }}</span>
        </a>
      }
    </mat-nav-list>

    <!-- <div class="sidebar-footer">
      <div class="avatar">🧑</div>
      <div>
        <p class="officer-name">Compliance Officer</p>
        <p class="officer-mail">admin@vault-tech.io</p>
      </div>
    </div> -->
  </mat-sidenav>

  <mat-sidenav-content class="shell-main" aria-label="Application shell">
    <mat-toolbar class="topbar">
      <p class="topbar-title">Central KYC Admin Portal</p>
      <span class="spacer"></span>
      <mat-form-field appearance="outline" class="topbar-search-field" subscriptSizing="dynamic">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput placeholder="Search verifications or entities..." />
      </mat-form-field>
      
      <div class="topbar-actions">
        <button mat-icon-button type="button" aria-label="Notifications">
          <mat-icon>notifications</mat-icon>
        </button>
        <button mat-icon-button type="button" aria-label="Help">
          <mat-icon>help_outline</mat-icon>
        </button>

        <button mat-button class="account-btn" [matMenuTriggerFor]="accountMenu">
          <span class="account-avatar">{{ userInitials }}</span>
          <span class="account-label">{{ userDisplayName }}</span>
          <mat-icon>expand_more</mat-icon>
        </button>

        <mat-menu #accountMenu="matMenu" class="account-menu">
          <div class="account-menu-head">
            <span class="menu-avatar">{{ userInitials }}</span>
            <div>
              <p class="menu-name">{{ userDisplayName }}</p>
              <p class="menu-email">{{ userEmail }}</p>
            </div>
          </div>
          <mat-divider></mat-divider>
          <a mat-menu-item [href]="profileUrl">
            <mat-icon>account_circle</mat-icon>
            <span>Profile</span>
          </a>
          <button mat-menu-item class="menu-link-danger" (click)="logout()">
            <mat-icon color="warn">logout</mat-icon>
            <span class="warn-text">Logout</span>
          </button>
        </mat-menu>
      </div>
    </mat-toolbar>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
