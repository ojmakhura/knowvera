<div class="shell-layout">
  <aside class="shell-sidebar" aria-label="Primary navigation">
    <div class="brand">
      <div class="brand-mark">◍</div>
      <div>
        <p class="brand-title">Central KYC</p>
        <!-- <p class="brand-subtitle">SaaS Enterprise</p> -->
      </div>
    </div>

    <button class="new-btn" type="button">＋ New Verification</button>

    <nav class="sidebar-nav">
      @for (item of menus; track item.titleKey) {
        <a
          class="nav-item"
          [routerLink]="item.routerLink"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
        >
          <span class="nav-icon material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
          <span translate>{{ item.titleKey }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="avatar">🧑</div>
      <div>
        <p class="officer-name">Compliance Officer</p>
        <p class="officer-mail">admin@vault-tech.io</p>
      </div>
    </div>
  </aside>

  <section class="shell-main" aria-label="Application shell">
    <header class="topbar">
      <p class="topbar-title">Central KYC Admin Portal</p>
      <input class="topbar-search" type="text" placeholder="Search verifications or entities..." />
      <div class="topbar-actions">
        <button type="button" class="icon-btn" aria-label="Notifications">•</button>
        <button type="button" class="icon-btn" aria-label="Help">?</button>
        <button type="button" class="account-btn" aria-haspopup="menu" [attr.aria-expanded]="accountMenuOpen()" (click)="toggleAccountMenu($event)">
          <span class="account-avatar">{{ userInitials }}</span>
          <span class="account-label">{{ userDisplayName }}</span>
          <span class="material-symbols-outlined account-caret" aria-hidden="true">expand_more</span>
        </button>

        @if (accountMenuOpen()) {
          <section class="account-menu" role="menu" aria-label="Account menu">
            <div class="account-menu-head">
              <span class="menu-avatar">{{ userInitials }}</span>
              <div>
                <p class="menu-name">{{ userDisplayName }}</p>
                <p class="menu-email">{{ userEmail }}</p>
              </div>
            </div>

            <div class="account-menu-actions">
              <a class="menu-link" [href]="profileUrl" (click)="closeAccountMenu()">
                <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
                Profile
              </a>
              <button type="button" class="menu-link menu-link-danger" (click)="logout()">
                <span class="material-symbols-outlined" aria-hidden="true">logout</span>
                Logout
              </button>
            </div>
          </section>
        }
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </section>
</div>
