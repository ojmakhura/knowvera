spring:
  datasource:
    url: jdbc:h2:mem:veritas;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    username: sa
    password: ""
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
veritas:
  # No Redis in the tests
  cache:
    enabled: false
  jobs:
    # No waiting for servers that are not there
    attempts: 1
  ollama:
    # Nothing listens here: Ollama steps fail fast
    base-url: http://localhost:9
  lm-studio:
    base-url: http://localhost:9
management:
  # No collector in the tests
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  health:
    # No broker in the tests
    rabbit:
      enabled: false
    redis:
      enabled: false
