# 
#spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost/centralkyc}_test
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.initialization-mode=always
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.show-sql = true
logging.level.root=INFO

app.rabbitmq.host=localhost
app.rabbitmq.port=5672
app.rabbitmq.username=guest
app.rabbitmq.password=guest
app.rabbitmq.documentHandlerDeadLetterExchange=x.document-dispatch-failure
app.rabbitmq.documentHandlerDeadLetterQueue=q.fall-back-document-dispatch
app.rabbitmq.documentHandlerDeadLetterRoutingKey=document-fall-back
app.rabbitmq.textExtractionQueueExchange=x.text-extraction-queue
app.rabbitmq.textExtractionQueue=q.text-extraction
app.rabbitmq.textExtractionQueueRoutingKey=text-extraction
app.rabbitmq.geminiTextExtractionQueueExchange=x.gemini-text-extraction-queue
app.rabbitmq.geminiTextExtractionQueue=q.gemini-text-extraction
app.rabbitmq.geminiTextExtractionQueueRoutingKey=gemini-text-extraction
app.rabbitmq.documentConfirmationQueueExchange=x.document-confirmation-queue
app.rabbitmq.documentConfirmationQueue=q.document-confirmation
app.rabbitmq.documentConfirmationQueueRoutingKey=document-confirmation
app.rabbitmq.textProcessingQueueExchange=x.text-processing-queue
app.rabbitmq.textProcessingQueue=q.text-processing
app.rabbitmq.textProcessingQueueRoutingKey=text-processing
app.rabbitmq.informationConfirmationQueueExchange=x.information-confirmation-queue
app.rabbitmq.informationConfirmationQueue=q.information-confirmation
app.rabbitmq.informationConfirmationQueueRoutingKey=information-confirmation
app.rabbitmq.textCleanupQueueExchange=x.text-cleanup-queue
app.rabbitmq.textCleanupQueue=q.text-cleanup
app.rabbitmq.textCleanupQueueRoutingKey=text-cleanup
app.rabbitmq.kycVerificationQueueExchange=x.kyc-verification-queue
app.rabbitmq.kycVerificationQueue=q.kyc-verification
app.rabbitmq.kycVerificationQueueRoutingKey=kyc-verification
app.rabbitmq.organisationVerificationQueueExchange=x.organisation-verification-queue
app.rabbitmq.organisationVerificationQueue=q.organisation-verification
app.rabbitmq.organisationVerificationQueueRoutingKey=organisation-verification
app.rabbitmq.individualVerificationQueueExchange=x.individual-verification-queue
app.rabbitmq.individualVerificationQueue=q.individual-verification
app.rabbitmq.individualVerificationQueueRoutingKey=individual-verification

