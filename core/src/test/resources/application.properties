# 
#spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost/centralkyc}_test
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.initialization-mode=always
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.show-sql = true
logging.level.root=INFO

app.rabbitmq.host=localhost
app.rabbitmq.port=5672
app.rabbitmq.username=guest
app.rabbitmq.password=guest
app.rabbitmq.documentHandler=q.document-handler
app.rabbitmq.documentDispatchExchange=x.post-document-dispatch
app.rabbitmq.documentDispatchQueue=q.document-dispatch
app.rabbitmq.documentDispatchRoutingKey=document-dispatch
app.rabbitmq.documentHandlerDeadLetterExchange=x.document-dispatch-failure
app.rabbitmq.documentHandlerDeadLetterQueue=q.fall-back-document-dispatch
app.rabbitmq.documentHandlerDeadLetterRoutingKey=document-fall-back
app.rabbitmq.documentQueueExchange=x.document-queue
app.rabbitmq.documentQueue=q.document-queue
app.rabbitmq.documentQueueRoutingKey=document-queue
app.rabbitmq.textProcessingHandler=q.text-processing-handler
app.rabbitmq.textProcessingDispatchExchange=x.text-processing-dispatch
app.rabbitmq.textProcessingDispatchQueue=q.text-processing-dispatch
app.rabbitmq.textProcessingDispatchRoutingKey=text-processing-dispatch
app.rabbitmq.textProcessingHandlerDeadLetterExchange=x.text-processing-dispatch-failure
app.rabbitmq.textProcessingHandlerDeadLetterQueue=q.fall-back-text-processing-dispatch
app.rabbitmq.textProcessingHandlerDeadLetterRoutingKey=text-processing-fall-back
app.rabbitmq.textProcessingQueueExchange=x.text-processing-queue
app.rabbitmq.textProcessingQueue=q.text-processing-queue
app.rabbitmq.textProcessingQueueRoutingKey=text-processing-queue
app.rabbitmq.extractedInformationHandler=q.extracted-information-handler
app.rabbitmq.extractedInformationDispatchExchange=x.extracted-information-dispatch
app.rabbitmq.extractedInformationDispatchQueue=q.extracted-information-dispatch
app.rabbitmq.extractedInformationDispatchRoutingKey=extracted-information-dispatch
app.rabbitmq.extractedInformationHandlerDeadLetterExchange=x.extracted-information-dispatch-failure
app.rabbitmq.extractedInformationHandlerDeadLetterQueue=q.fall-back-extracted-information-dispatch
app.rabbitmq.extractedInformationHandlerDeadLetterRoutingKey=extracted-information-fall-back
app.rabbitmq.extractedInformationQueueExchange=x.extracted-information-queue
app.rabbitmq.extractedInformationQueue=q.extracted-information-queue
app.rabbitmq.extractedInformationQueueRoutingKey=extracted-information-queue

