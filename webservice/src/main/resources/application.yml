logging:
  level:
    org:
      springframework:  ${SPRING_LOG_LEVEL:INFO}
      hibernate:  ${HIBERNATE_LOG_LEVEL:INFO}
    bw:
      co:
        roguesystems: ${KYC_LOG_LEVEL:DEBUG}
server:
  port: ${PORT:8085}
  # Client address from X-Forwarded-For only when set by a trusted (internal) proxy such as Traefik
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  servlet:
    context-path: /
  compression:
    enabled: true
springdoc:
  swagger-ui:
    oauth:
      client-id: swagger-client
      use-pkce-with-authorization-code-grant: true
spring:
  application:
    name: knowvera-webservice
  threads:
    virtual:
      enabled: true
  datasource:
    # URL, username and password: DATABASE_URL, DB_USERNAME, DB_PASSWORD (core-application.properties)
    driver-class-name: ${DRIVER_CLASS:org.postgresql.Driver}
  jpa:
    database-platform: ${DB_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        # ddl-auto=update re-creates named unique constraints at every start by default; only
        # create the missing ones
        schema_update:
          unique_constraint_strategy: RECREATE_QUIETLY
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:100MB}  # several files per KYC application
      location: ${java.io.tmpdir}
      file-size-threshold: 50MB
  thymeleaf:
    cache: false
  mvc:
    format:
      date: iso
      date-time: iso
      time: HH:mm:ss
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672} 
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # The broker confirms every publish and returns unroutable ones, so lost messages are logged
    # (RabbitMQConfig, ConfirmedPublisher) instead of disappearing
    publisher-confirm-type: correlated
    publisher-returns: true
  cloud:
    aws:
      # Document storage (S3). The MINIO_* variables still work as fallbacks.
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
      region:
        # Must match the server: Garage's s3_region (default "garage"); SeaweedFS accepts any
        static: ${S3_REGION:garage}
      s3:
        # The endpoint is storage.s3.endpoint (set only when given; an empty one fails here)
        # Self-hosted servers expect http://host/bucket/key URLs
        path-style-access-enabled: true
  liquibase:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_URL:http://localhost:8970}/realms/${REALM:knowvera}
          # Only tokens meant for this API (the realm's portal clients add it with an audience mapper)
          audiences: ${JWT_AUDIENCES:knowvera-api}

  cache:
    redis:
      time-to-live: 30m # 10 minutes in milliseconds
      cache-null-values: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT:100}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s
  ai:
    chat:
    
      client:
        enabled: false
    model:
      chat: ${MODEL_CHAT:vertexai}
    openai:
      # Redirect from official API to LM Studio
      base-url: http://localhost:1234
      # LM Studio doesn't require a real key, but the starter expects a value
      api-key: lm-studio
      chat:
        client:
        ## LM Studio's chat endpoint is compatible with OpenAI's API, so we can use the same client configuration
          enabled: false
      audio:
        speech:
          enabled: false  # This stops the broken AutoConfig from loading
        transcription:
          enabled: false
        options:
          # Must match the exact model name/path in LM Studio
          # model: lmstudio-community/Meta-Llama-3.1-8B-Instruct-GGUF
          model: ${LLM_MODEL:deepseek-r1-distill-qwen-32b}
          temperature: 0.7
    vertex:
      ai:
        gemini:
          enabled: true
          # --- Core Connection Settings ---
          project-id: ${GEMINI_PROJECT_ID:central-kyc}
          location: ${GEMINI_LOCATION:us-central1}
          # If using a physical file (not recommended for production)
          # credentials-uri: file://${GCP_CREDENTIALS_FILE:/path/to/credentials.json}
          
          # --- Default Model Behavior ---
          chat:
            enabled: false
            options:
              # Common models: gemini-1.5-pro, gemini-2.0-flash, gemini-3.1-flash
              model: ${SPRING_AI_VERTEX_MODEL:gemini-2.5-flash}
              temperature: 0.7        # 0.0 = deterministic, 1.0 = creative
              top-p: 0.95             # Nucleus sampling
              top-k: 40               # Top-K sampling
              # max-output-tokens: 2048
              
              # --- 2026 Specific Features ---
              # thinking-budget: 8192   # Token budget for "Chain of Thought" reasoning
              # response-mime-type: application/json # Force JSON output if needed

              # --- Safety Settings (Strict for Enterprise) ---
              # safety-settings:
              #   - category: HARM_CATEGORY_HATE_SPEECH
              #     threshold: BLOCK_MEDIUM_AND_ABOVE
              #   - category: HARM_CATEGORY_DANGEROUS_CONTENT
              #     threshold: BLOCK_ONLY_HIGH
              #   - category: HARM_CATEGORY_HARASSMENT
              #     threshold: BLOCK_LOW_AND_ABOVE
management:
  endpoint:
    health:
      show-details: never
    metrics:
      access: READ_ONLY
    prometheus:
      access: READ_ONLY
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # Metrics are pushed over OTLP; health and info only, the rest is not reachable over HTTP
        include: ${ACTUATOR_EXPOSURE:health,info}
        exclude: env,shutdown,heapdump
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${spring.application.version}
  tracing:
    sampling:
      probability: 1.0  # 100% for development
  otlp:
    metrics:
      export:
        url: ${OTLP_URL:http://localhost:4318}/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_URL:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_URL:http://localhost:4318}/v1/logs
rate-limiting:
  # Requests per minute per signed-in user
  tokens: ${RATE_LIMIT:2000}
  # Requests per minute per IP address for calls without a token (public endpoints)
  public-tokens: ${PUBLIC_RATE_LIMIT:30}
# Document storage: the bucket on an external S3-compatible server (SeaweedFS, Garage, AWS S3).
# The client itself is configured under spring.cloud.aws (Spring Cloud AWS).
storage:
  s3:
    # The server's S3 API, e.g. https://s3.example.com; blank: AWS S3 itself
    endpoint: ${S3_ENDPOINT:${MINIO_URL:}}
    bucket: ${S3_BUCKET:${MINIO_BUCKET:knowvera}}
    # Create the bucket on first upload. Garage keys need --create-bucket for this; otherwise
    # create the bucket on the server and turn this off.
    create-bucket: ${S3_CREATE_BUCKET:true}
app:
  verification:
    # Automated checks may mark documents VERIFIED on their own (type match and data score);
    # off: passing documents go to MANUAL_REVIEW for a KYC reviewer
    auto-verify: ${DOCUMENT_AUTO_VERIFY:false}
  keycloak:
    # Keycloak Authorization Services for the API client: the caller's permissions (SCOPE_*
    # authorities), cached per token in the two-level cache (Caffeine, then Redis; AuthzCache)
    authz:
      server-url: ${AUTH_URL:http://localhost:8970}
      realm: ${REALM:knowvera}
      client-id: ${app.authz.client}
      client-secret: ${app.authz.client-secret}
      # Never past the token's expiry
      permission-cache-ttl: ${AUTHZ_PERMISSION_CACHE_TTL:5m}
      # In-process copy in front of Redis: how long, and how many entries
      local-cache-ttl: ${AUTHZ_LOCAL_CACHE_TTL:1m}
      local-cache-max-size: ${AUTHZ_LOCAL_CACHE_MAX_SIZE:10000}
    # Keycloak admin API results (accounts, roles, Organizations) in the same two-level cache
    # (KeycloakCache); 0s turns one off. Changes made through the API evict a user at once,
    # changes made in the Keycloak console show after the TTL.
    cache:
      user-ttl: ${KEYCLOAK_USER_CACHE_TTL:1m}
      role-ttl: ${KEYCLOAK_ROLE_CACHE_TTL:10m}
      organisation-ttl: ${KEYCLOAK_ORGANISATION_CACHE_TTL:10m}
  users:
    # New accounts get no password: Keycloak emails a link to set one (needs the realm's SMTP
    # settings). How long that link stays valid:
    setup-link-lifespan: ${USER_SETUP_LINK_LIFESPAN:72h}
  # Realm role of self-registered users (roles: keycloak/generate_authz.py)
  realmUserRole: ${REALM_USER_ROLE:APPLICANT}
  audit:
    partition:
      # Keep historical partitions available for this many past months.
      months-history: ${AUDIT_PARTITION_MONTHS_HISTORY:12}
      # Always ensure this many future months exist.
      months-future: ${AUDIT_PARTITION_MONTHS_FUTURE:12}
      maintenance:
        # Delay first maintenance run after startup (milliseconds).
        initial-delay-ms: ${AUDIT_PARTITION_MAINTENANCE_INITIAL_DELAY_MS:30000}
        # Background maintenance interval (milliseconds).
        fixed-delay-ms: ${AUDIT_PARTITION_MAINTENANCE_FIXED_DELAY_MS:300000}
  request-token-length: ${REQUEST_TOKEN_LENGTH:32}
  # Lifetime of the emailed client request link, and of the confirmation / registration tokens it mints
  request-token-link-ttl: ${REQUEST_TOKEN_LINK_TTL:7d}
  request-token-session-ttl: ${REQUEST_TOKEN_SESSION_TTL:24h}
  registration-url: ${REGISTRATION_URL:http://localhost:4300/register}
  admin-web: ${ADMIN_WEB_URL:http://localhost:4200}
  # Browser origins allowed to call the API (the admin portal and the customer portal)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
  tessdata-prefix: ${TESSDATA_PREFIX:/usr/share/tesseract-ocr/5/tessdata}
  tessdata-langs: ${TESSDATA_LANGS:eng}
  comm:
    base-url: ${COMM_SERVICE_URL}
    send-message: ${SEND_MESSAGE_URL}
    source-email: ${SOURCE_EMAIL}
  security:
    password:
      # Matches the realm's password policy (keycloak/generate_authz.py PASSWORD_POLICY)
      min-length: ${MIN_PASSWORD_LENGTH:12}
  organisation:
    manager-role: ${ORGANISATION_MANAGER_ROLE:ORG_ADMIN}
  llm:
    id: ${LLM_ID:ollama}
    model: ${LLM_MODEL:gemma4}
  lmstudio:
    base-url: ${LMSTUDIO_BASE_URL:http://localhost:1234}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:gemma4}
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_KEY:${GEMINI_API_KEY:}}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    project-id: ${GEMINI_PROJECT_ID:knowvera-kyc}
    location: ${GEMINI_LOCATION:us-central1}
    credentials-path: ${GCP_CREDENTIALS_FILE:/path/to/credentials.json}
  # Keycloak resource-based authorization (policy enforcer) for the knowvera-api client
  authz:
    # Policy enforcer filter: Keycloak decides per path + HTTP method
    enabled: ${AUTHZ_ENABLED:true}
    # Keycloak permissions as authorities, e.g. @PreAuthorize("hasAuthority('SCOPE_organisations:view')")
    permission-authorities: ${AUTHZ_PERMISSION_AUTHORITIES:true}
    client: ${API_CLIENT:${CLIENT_ID:knowvera-api}}
    client-secret: ${API_CLIENT_SECRET:${CLIENT_SECRET:secret}}
    # Generated by keycloak/generate_authz.py
    enforcer-config: ${AUTHZ_ENFORCER_CONFIG:keycloak/policy-enforcer.json}
  rabbitmq:
    # Dead-letter queue for text extraction failures
    documentHandlerDeadLetterExchange: ${DOCUMENT_HANDLER_DEAD_LETTER_EXCHANGE:x.document-dispatch-failure}
    documentHandlerDeadLetterQueue: ${DOCUMENT_HANDLER_DEAD_LETTER_QUEUE:q.fall-back-document-dispatch}
    documentHandlerDeadLetterRoutingKey: ${DOCUMENT_HANDLER_DEAD_LETTER_ROUTING_KEY:document-fall-back}
    
    textExtractionQueueExchange: ${TEXT_EXTRACTION_QUEUE_EXCHANGE:x.text-extraction-queue}
    textExtractionQueue: ${TEXT_EXTRACTION_QUEUE:q.text-extraction}
    textExtractionQueueRoutingKey: ${TEXT_EXTRACTION_QUEUE_ROUTING_KEY:text-extraction}

    geminiTextExtractionQueueExchange: ${GEMINI_TEXT_EXTRACTION_QUEUE_EXCHANGE:x.gemini-text-extraction-queue}
    geminiTextExtractionQueue: ${GEMINI_TEXT_EXTRACTION_QUEUE:q.gemini-text-extraction}
    geminiTextExtractionQueueRoutingKey: ${GEMINI_TEXT_EXTRACTION_QUEUE_ROUTING_KEY:gemini-text-extraction}

    documentConfirmationQueueExchange: ${DOCUMENT_CONFIRMATION_QUEUE_EXCHANGE:x.document-confirmation-queue}
    documentConfirmationQueue: ${DOCUMENT_CONFIRMATION_QUEUE:q.document-confirmation}
    documentConfirmationQueueRoutingKey: ${DOCUMENT_CONFIRMATION_QUEUE_ROUTING_KEY:document-confirmation}

    textProcessingQueueExchange: ${TEXT_PROCESSING_QUEUE_EXCHANGE:x.text-processing-queue}
    textProcessingQueue: ${TEXT_PROCESSING_QUEUE:q.text-processing}
    textProcessingQueueRoutingKey: ${TEXT_PROCESSING_QUEUE_ROUTING_KEY:text-processing}

    informationConfirmationQueueExchange: ${INFORMATION_CONFIRMATION_QUEUE_EXCHANGE:x.information-confirmation-queue}
    informationConfirmationQueue: ${INFORMATION_CONFIRMATION_QUEUE:q.information-confirmation}
    informationConfirmationQueueRoutingKey: ${INFORMATION_CONFIRMATION_QUEUE_ROUTING_KEY:information-confirmation}

    textCleanupQueueExchange: ${TEXT_CLEANUP_QUEUE_EXCHANGE:x.text-cleanup-queue}
    textCleanupQueue: ${TEXT_CLEANUP_QUEUE:q.text-cleanup}
    textCleanupQueueRoutingKey: ${TEXT_CLEANUP_QUEUE_ROUTING_KEY:text-cleanup}

    kycVerificationQueueExchange: ${KYC_VERIFICATION_QUEUE_EXCHANGE:x.kyc-verification-queue}
    kycVerificationQueue: ${KYC_VERIFICATION_QUEUE:q.kyc-verification}
    kycVerificationQueueRoutingKey: ${KYC_VERIFICATION_QUEUE_ROUTING_KEY:kyc-verification}

    organisationVerificationQueueExchange: ${ORGANISATION_VERIFICATION_QUEUE_EXCHANGE:x.organisation-verification-queue}
    organisationVerificationQueue: ${ORGANISATION_VERIFICATION_QUEUE:q.organisation-verification}
    organisationVerificationQueueRoutingKey: ${ORGANISATION_VERIFICATION_QUEUE_ROUTING_KEY:organisation-verification}

    individualVerificationQueueExchange: ${INDIVIDUAL_VERIFICATION_QUEUE_EXCHANGE:x.individual-verification-queue}
    individualVerificationQueue: ${INDIVIDUAL_VERIFICATION_QUEUE:q.individual-verification}
    individualVerificationQueueRoutingKey: ${INDIVIDUAL_VERIFICATION_QUEUE_ROUTING_KEY:individual-verification}

  novu:
    api-key: ${NOVU_API_KEY:}
    base-url: ${NOVU_BASE_URL:https://api.novu.co}
    # Failed triggers are retried with back-off, then moved to the dead-letter queues
    # (<queue>.dlq on the dead-letter exchange) instead of being dropped
    retry:
      max-retries: ${NOVU_RETRY_MAX_RETRIES:3}
      initial-interval: ${NOVU_RETRY_INITIAL_INTERVAL:2s}
      multiplier: ${NOVU_RETRY_MULTIPLIER:3}
      max-interval: ${NOVU_RETRY_MAX_INTERVAL:30s}
    # Consumers per Novu queue, each prefetching one message, so a message waiting between retries
    # does not hold up the rest of its queue
    consumers:
      concurrency: ${NOVU_CONSUMERS:3}
      max-concurrency: ${NOVU_MAX_CONSUMERS:10}
    queue:
      deadLetterExchange: ${NOVU_DEAD_LETTER_EXCHANGE:x.novu-dead-letter}
      newUserNovuId: ${NOVU_NEW_USER_NOVU_ID:novu-new-user}
      newUserQueueExchange: ${NOVU_NEW_USER_QUEUE_EXCHANGE:x.novu-new-user-queue}
      newUserQueue: ${NOVU_NEW_USER_QUEUE:q.novu-new-user}
      newUserQueueRoutingKey: ${NOVU_NEW_USER_QUEUE_ROUTING_KEY:novu-new-user}

      newOrgUserNovuId: ${NOVU_NEW_ORG_USER_NOVU_ID:novu-new-org-user}
      newOrgUserQueueExchange: ${NOVU_NEW_ORG_USER_QUEUE_EXCHANGE:x.novu-new-org-user-queue}
      newOrgUserQueue: ${NOVU_NEW_ORG_USER_QUEUE:q.novu-new-org-user}
      newOrgUserQueueRoutingKey: ${NOVU_NEW_ORG_USER_QUEUE_ROUTING_KEY:novu-new-org-user}

      newOrgClientRequestNovuId: ${NOVU_NEW_ORG_CLIENT_REQUEST_NOVU_ID:novu-new-org-client-request}
      newOrgClientRequestQueueExchange: ${NOVU_NEW_ORG_CLIENT_REQUEST_QUEUE_EXCHANGE:x.novu-new-org-client-request-queue}
      newOrgClientRequestQueue: ${NOVU_NEW_ORG_CLIENT_REQUEST_QUEUE:q.novu-new-org-client-request}
      newOrgClientRequestQueueRoutingKey: ${NOVU_NEW_ORG_CLIENT_REQUEST_QUEUE_ROUTING_KEY:novu-new-org-client-request}

      newKycRecordNovuId: ${NOVU_NEW_KYC_RECORD_NOVU_ID:novu-new-kyc-record}
      newKycRecordQueueExchange: ${NOVU_NEW_KYC_RECORD_QUEUE_EXCHANGE:x.novu-new-kyc-record-queue}
      newKycRecordQueue: ${NOVU_NEW_KYC_RECORD_QUEUE:q.novu-new-kyc-record}
      newKycRecordQueueRoutingKey: ${NOVU_NEW_KYC_RECORD_QUEUE_ROUTING_KEY:novu-new-kyc-record}

      