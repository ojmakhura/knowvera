services:
  # ---------------------------------------------------------------------------
  # knowvera Web Service - the application (built from ./knowvera-api/Dockerfile)
  # ---------------------------------------------------------------------------
  knowvera-webservice:
    image: knowvera-webservice:latest
    ports:
      - "${PORT:-8085}:8085"
    environment:
      # --- Server / logging ---
      PORT: ${PORT:-8085}
      SPRING_LOG_LEVEL: ${SPRING_LOG_LEVEL:-INFO}
      HIBERNATE_LOG_LEVEL: ${HIBERNATE_LOG_LEVEL:-INFO}
      KYC_LOG_LEVEL: ${KYC_LOG_LEVEL:-INFO}
      SHOW_SQL: ${SHOW_SQL:-false}

      # --- Datasource (core-application.properties) ---
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/knowvera}
      DB_USERNAME: ${DB_USERNAME:-knowvera}
      DB_PASSWORD: ${DB_PASSWORD:-knowvera}
      HIKARI_CONNECTION_TIMEOUT: ${HIKARI_CONNECTION_TIMEOUT:-3000}
      HIKARI_MAX_LIFETIME: ${HIKARI_MAX_LIFETIME:-1200000}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-5}
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-20}

      # --- RabbitMQ ---
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

      # --- Security / OAuth2 (Keycloak) ---
      AUTH_URL: ${AUTH_URL:-http://keycloak:8970}
      REALM: ${REALM:-knowvera}

      # --- Redis ---
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # --- Observability ---
      OTLP_URL: ${OTLP_URL:-http://localhost:4318}

      # --- Rate limiting ---
      RATE_LIMIT: ${RATE_LIMIT:-2000}

      # --- Document storage: an external S3-compatible server (SeaweedFS, Garage; docs/storage.md) ---
      S3_ENDPOINT: ${S3_ENDPOINT:-${MINIO_URL:-}}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ACCESS_KEY:-}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_SECRET_KEY:-}}
      S3_BUCKET: ${S3_BUCKET:-${MINIO_BUCKET:-knowvera}}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}

      # --- Application roles ---
      REALM_USER_ROLE: ${REALM_USER_ROLE:-APPLICANT}
      ORGANISATION_MANAGER_ROLE: ${ORGANISATION_MANAGER_ROLE:-ORG_ADMIN}

      # --- Audit partition maintenance ---
      AUDIT_PARTITION_MONTHS_HISTORY: ${AUDIT_PARTITION_MONTHS_HISTORY:-12}
      AUDIT_PARTITION_MONTHS_FUTURE: ${AUDIT_PARTITION_MONTHS_FUTURE:-12}
      AUDIT_PARTITION_MAINTENANCE_INITIAL_DELAY_MS: ${AUDIT_PARTITION_MAINTENANCE_INITIAL_DELAY_MS:-30000}
      AUDIT_PARTITION_MAINTENANCE_FIXED_DELAY_MS: ${AUDIT_PARTITION_MAINTENANCE_FIXED_DELAY_MS:-300000}

      # --- Misc application settings ---
      REQUEST_TOKEN_LENGTH: ${REQUEST_TOKEN_LENGTH:-32}
      REGISTRATION_URL: ${REGISTRATION_URL:-http://localhost:4300/register}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-http://localhost:4200}
      MIN_PASSWORD_LENGTH: ${MIN_PASSWORD_LENGTH:-12}

      # --- Communication service ---
      COMM_SERVICE_URL: ${COMM_SERVICE_URL:-}
      SEND_MESSAGE_URL: ${SEND_MESSAGE_URL:-}
      SOURCE_EMAIL: ${SOURCE_EMAIL:-}

      # --- Resource-based authorization (Keycloak policy enforcer) ---
      AUTHZ_ENABLED: ${AUTHZ_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4300}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-knowvera-api}
      DOCUMENT_AUTO_VERIFY: ${DOCUMENT_AUTO_VERIFY:-false}

      # --- Document processing (veritas-processor) ---
      PROCESSING_DEFAULT_PROFILE: ${PROCESSING_DEFAULT_PROFILE:-default}
      VERITAS_URL: ${VERITAS_URL:-http://veritas-processor:8086}
      VERITAS_SEED_PROFILES: ${VERITAS_SEED_PROFILES:-false}
      # What the removed pipeline's LM_STUDIO tool meant, for VERITAS_SEED_PROFILES
      LLM_ID: ${LLM_ID:-ollama}
      AUTHZ_PERMISSION_AUTHORITIES: ${AUTHZ_PERMISSION_AUTHORITIES:-true}
      API_CLIENT: ${API_CLIENT:-knowvera-api}
      API_CLIENT_SECRET: ${API_CLIENT_SECRET:-secret}

      # --- RabbitMQ exchanges / queues / routing keys ---
      INFORMATION_CONFIRMATION_QUEUE_EXCHANGE: ${INFORMATION_CONFIRMATION_QUEUE_EXCHANGE:-x.information-confirmation-queue}
      INFORMATION_CONFIRMATION_QUEUE: ${INFORMATION_CONFIRMATION_QUEUE:-q.information-confirmation}
      INFORMATION_CONFIRMATION_QUEUE_ROUTING_KEY: ${INFORMATION_CONFIRMATION_QUEUE_ROUTING_KEY:-information-confirmation}
      KYC_VERIFICATION_QUEUE_EXCHANGE: ${KYC_VERIFICATION_QUEUE_EXCHANGE:-x.kyc-verification-queue}
      KYC_VERIFICATION_QUEUE: ${KYC_VERIFICATION_QUEUE:-q.kyc-verification}
      KYC_VERIFICATION_QUEUE_ROUTING_KEY: ${KYC_VERIFICATION_QUEUE_ROUTING_KEY:-kyc-verification}
      ORGANISATION_VERIFICATION_QUEUE_EXCHANGE: ${ORGANISATION_VERIFICATION_QUEUE_EXCHANGE:-x.organisation-verification-queue}
      ORGANISATION_VERIFICATION_QUEUE: ${ORGANISATION_VERIFICATION_QUEUE:-q.organisation-verification}
      ORGANISATION_VERIFICATION_QUEUE_ROUTING_KEY: ${ORGANISATION_VERIFICATION_QUEUE_ROUTING_KEY:-organisation-verification}
      INDIVIDUAL_VERIFICATION_QUEUE_EXCHANGE: ${INDIVIDUAL_VERIFICATION_QUEUE_EXCHANGE:-x.individual-verification-queue}
      INDIVIDUAL_VERIFICATION_QUEUE: ${INDIVIDUAL_VERIFICATION_QUEUE:-q.individual-verification}
      INDIVIDUAL_VERIFICATION_QUEUE_ROUTING_KEY: ${INDIVIDUAL_VERIFICATION_QUEUE_ROUTING_KEY:-individual-verification}

      # --- Novu notifications ---
      NOVU_API_KEY: ${NOVU_API_KEY:-}
      NOVU_BASE_URL: ${NOVU_BASE_URL:-https://api.novu.co}
      NOVU_NEW_USER_NOVU_ID: ${NOVU_NEW_USER_NOVU_ID:-novu-new-user}
      NOVU_NEW_USER_QUEUE_EXCHANGE: ${NOVU_NEW_USER_QUEUE_EXCHANGE:-x.novu-new-user-queue}
      NOVU_NEW_USER_QUEUE: ${NOVU_NEW_USER_QUEUE:-q.novu-new-user}
      NOVU_NEW_USER_QUEUE_ROUTING_KEY: ${NOVU_NEW_USER_QUEUE_ROUTING_KEY:-novu-new-user}
      NOVU_NEW_ORG_USER_NOVU_ID: ${NOVU_NEW_ORG_USER_NOVU_ID:-novu-new-org-user}
      NOVU_NEW_ORG_USER_QUEUE_EXCHANGE: ${NOVU_NEW_ORG_USER_QUEUE_EXCHANGE:-x.novu-new-org-user-queue}
      NOVU_NEW_ORG_USER_QUEUE: ${NOVU_NEW_ORG_USER_QUEUE:-q.novu-new-org-user}
      NOVU_NEW_ORG_USER_QUEUE_ROUTING_KEY: ${NOVU_NEW_ORG_USER_QUEUE_ROUTING_KEY:-novu-new-org-user}
      NOVU_NEW_ORG_CLIENT_REQUEST_NOVU_ID: ${NOVU_NEW_ORG_CLIENT_REQUEST_NOVU_ID:-novu-new-org-client-request}
      NOVU_NEW_ORG_CLIENT_REQUEST_QUEUE_EXCHANGE: ${NOVU_NEW_ORG_CLIENT_REQUEST_QUEUE_EXCHANGE:-x.novu-new-org-client-request-queue}
      NOVU_NEW_ORG_CLIENT_REQUEST_QUEUE: ${NOVU_NEW_ORG_CLIENT_REQUEST_QUEUE:-q.novu-new-org-client-request}
      NOVU_NEW_ORG_CLIENT_REQUEST_QUEUE_ROUTING_KEY: ${NOVU_NEW_ORG_CLIENT_REQUEST_QUEUE_ROUTING_KEY:-novu-new-org-client-request}
      NOVU_NEW_KYC_RECORD_NOVU_ID: ${NOVU_NEW_KYC_RECORD_NOVU_ID:-novu-new-kyc-record}
      NOVU_NEW_KYC_RECORD_QUEUE_EXCHANGE: ${NOVU_NEW_KYC_RECORD_QUEUE_EXCHANGE:-x.novu-new-kyc-record-queue}
      NOVU_NEW_KYC_RECORD_QUEUE: ${NOVU_NEW_KYC_RECORD_QUEUE:-q.novu-new-kyc-record}
      NOVU_NEW_KYC_RECORD_QUEUE_ROUTING_KEY: ${NOVU_NEW_KYC_RECORD_QUEUE_ROUTING_KEY:-novu-new-kyc-record}
    labels:
      - "traefik.enable=true"
      # HTTP router
      - "traefik.http.routers.knowvera.rule=Host(`${WEBSERVICE_HOST:-knowvera.localhost}`)"
      - "traefik.http.routers.knowvera.entrypoints=web"
      - "traefik.http.services.knowvera.loadbalancer.server.port=8085"
      # Health check
      - "traefik.http.services.knowvera.loadbalancer.healthcheck.path=/actuator/health"
      - "traefik.http.services.knowvera.loadbalancer.healthcheck.interval=30s"
    networks:
      - knowvera

  # ---------------------------------------------------------------------------
  # veritas-processor - document AI processing (built from ./veritas-processor/Dockerfile)
  # ---------------------------------------------------------------------------
  veritas-processor:
    image: ${VERITAS_IMAGE_NAME:-veritas-processor}:latest
    ports:
      - "${VERITAS_PORT:-8086}:8086"
    environment:
      VERITAS_PORT: 8086
      # --- Its own database (profiles and job history) ---
      VERITAS_DATABASE_URL: ${VERITAS_DATABASE_URL:-jdbc:postgresql://postgres:5432/veritas}
      VERITAS_DB_USERNAME: ${VERITAS_DB_USERNAME:-veritas}
      VERITAS_DB_PASSWORD: ${VERITAS_DB_PASSWORD:-veritas}
      # --- RabbitMQ (jobs and results: x.veritas) ---
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # --- Keycloak (tokens for veritas-processor) ---
      AUTH_URL: ${AUTH_URL:-http://keycloak:8970}
      REALM: ${REALM:-knowvera}
      VERITAS_CLIENT_ID: ${VERITAS_CLIENT_ID:-veritas-processor}
      VERITAS_JWT_AUDIENCES: ${VERITAS_JWT_AUDIENCES:-veritas-processor}
      # --- Document storage (read access to the knowvera bucket) ---
      S3_ENDPOINT: ${S3_ENDPOINT:-${MINIO_URL:-}}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY: ${VERITAS_S3_ACCESS_KEY:-${S3_ACCESS_KEY:-${MINIO_ACCESS_KEY:-}}}
      S3_SECRET_KEY: ${VERITAS_S3_SECRET_KEY:-${S3_SECRET_KEY:-${MINIO_SECRET_KEY:-}}}
      S3_BUCKET: ${S3_BUCKET:-${MINIO_BUCKET:-knowvera}}
      # --- Providers ---
      VERITAS_LOCAL_ONLY: ${VERITAS_LOCAL_ONLY:-${PROCESSING_LOCAL_ONLY:-false}}
      TESSDATA_PREFIX: ${TESSDATA_PREFIX:-/usr/share/tesseract-ocr/5/tessdata}
      TESSDATA_LANGS: ${TESSDATA_LANGS:-eng}
      LLM_MODEL: ${LLM_MODEL:-gemma4}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://localhost:1234}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4}
      GEMINI_PROJECT_ID: ${GEMINI_PROJECT_ID:-central-kyc}
      GEMINI_LOCATION: ${GEMINI_LOCATION:-us-central1}
      SPRING_AI_VERTEX_MODEL: ${SPRING_AI_VERTEX_MODEL:-gemini-2.5-flash}
      VERITAS_JOB_CONCURRENCY: ${VERITAS_JOB_CONCURRENCY:-1-4}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      LLM_READ_TIMEOUT: ${LLM_READ_TIMEOUT:-5m}
      # --- Job history and limits ---
      # How long jobs (document text and fields included) are kept, e.g. 90d; empty: forever
      VERITAS_JOB_RETENTION: ${VERITAS_JOB_RETENTION:-}
      VERITAS_MAX_FILE_SIZE: ${VERITAS_MAX_FILE_SIZE:-25MB}
      VERITAS_MAX_PAGES: ${VERITAS_MAX_PAGES:-50}
      # The API documentation needs no sign-in: off unless asked for
      VERITAS_API_DOCS: ${VERITAS_API_DOCS:-false}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.veritas.rule=Host(`${VERITAS_HOST:-veritas.localhost}`)"
      - "traefik.http.routers.veritas.entrypoints=web"
      - "traefik.http.services.veritas.loadbalancer.server.port=8086"
      - "traefik.http.services.veritas.loadbalancer.healthcheck.path=/actuator/health"
      - "traefik.http.services.veritas.loadbalancer.healthcheck.interval=30s"
    networks:
      - knowvera

networks:
  knowvera:
    driver: bridge
