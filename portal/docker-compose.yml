services:
  portal:
    image: ojmakhura/centralkyc-portal:latest
    volumes:
      - ./public/env.json:/usr/share/nginx/html/env.json:ro
    networks:
      - traefik_proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.centralkyc-portal.rule=Host(`centralkyc.roguedev.local`)"
        - "traefik.http.routers.centralkyc-portal.entrypoints=websecure"
        - "traefik.http.routers.centralkyc-portal.tls=true"
        - "traefik.http.services.centralkyc-portal.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik_proxy"

networks:
  traefik_proxy:
    external: true
