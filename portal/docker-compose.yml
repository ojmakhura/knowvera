services:
  portal:
    image: ojmakhura/knowvera-portal:latest
    volumes:
      - ./public/env.json:/usr/share/nginx/html/env.json:ro
    networks:
      - traefik_proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.knowvera-portal.rule=Host(`knowvera.example.com`)"
        - "traefik.http.routers.knowvera-portal.entrypoints=websecure"
        - "traefik.http.routers.knowvera-portal.tls=true"
        - "traefik.http.services.knowvera-portal.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik_proxy"

networks:
  traefik_proxy:
    external: true
