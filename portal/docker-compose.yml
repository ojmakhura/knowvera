services:
  portal:
    image: ojmakhura/kyvera-portal:latest
    volumes:
      - ./public/env.json:/usr/share/nginx/html/env.json:ro
    networks:
      - traefik_proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.kyvera-portal.rule=Host(`kyvera.roguedev.local`)"
        - "traefik.http.routers.kyvera-portal.entrypoints=websecure"
        - "traefik.http.routers.kyvera-portal.tls=true"
        - "traefik.http.services.kyvera-portal.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik_proxy"

networks:
  traefik_proxy:
    external: true
