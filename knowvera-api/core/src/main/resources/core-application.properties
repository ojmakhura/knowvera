# 
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost/knowvera}
spring.datasource.username=${DB_USERNAME:knowvera}
spring.datasource.password=${DB_PASSWORD:knowvera}
logging.level.root=INFO

#hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#hibernate.default_batch_fetch_size = 16
spring.jpa.hibernate.ddl-auto = update
#hibernate.cache.use_second_level_cache = false
# hibernate.cache.provider_class = org.hibernate.cache.EhCacheProvider
# hibernate.cache.query_cache_factory = org.hibernate.cache.StandardQueryCacheFactory

spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:3000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1200000}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
